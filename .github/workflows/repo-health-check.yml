name: Repository Health Check
on: push 
# env: 
#     FILE_PRESENT: NOT PRESENT
jobs:
     job1:
        runs-on: ubuntu-latest
        steps:
            - run: echo "start job"    
            - uses: actions/checkout@v4
            - run: ls
            - env:
                 FILE_CHECK: find . -maxdepth 1 -name "README.md"
              if: ${{ enV.FILE_CHECK == ""}}
                  exit 1
              run: echo "File is present. SUCCESS"
            