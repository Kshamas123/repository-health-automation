name: Repository Health Check
on: push 
# env: 
#     FILE_PRESENT: NOT PRESENT
jobs:
     job1:
        runs-on: ubuntu-latest
        steps:
            - run: echo "start job"    
            - uses: actions/checkout@v4
            - run: ls
            - run: |
                 FILE_CHECK=$(find . -type f -name "README.md")
                 if [ -n $FILE_CHECK ]; then
                  echo "README.md is present. SUCCESS"
                 else
                  echo "README.md is missing. FAILURE"
                  exit 1
                 fi
            